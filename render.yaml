services:
  - type: web
    name: stridetrack-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /rep-api/health
    disk:
      name: stridetrack-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CALORIE_DB_PATH
        value: /data/calories.sqlite3
      - key: COUNTRY_QUEST_DB_PATH
        value: /data/country-quests.sqlite3
      - key: COMMUNITY_GOALS_DB_PATH
        value: /data/community-goals.sqlite3
