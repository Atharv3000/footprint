name: Security & Regression CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no .env file is committed in repository
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must not be committed to git."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run security hygiene & client regression tests
        run: |
          node scripts/test-security-hygiene.cjs
          node scripts/test-account-isolation.cjs
          node scripts/test-rep-client.cjs
          node scripts/test-calorie-challenges.cjs
          node scripts/test-country-quests.cjs
          node scripts/test-community-goals.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python backend dependencies
        run: pip install -r server/requirements.txt

      - name: Run Python backend & security tests
        run: python -m unittest discover -s server/tests -v
